# 24hrsprinting backend test deployment. Create this Blueprint in Render.
# The storefront stays on GitHub Pages; data stays in Supabase PostgreSQL.
services:
  - type: web
    name: 24hrsprinting-api-test
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ekfk1003.github.io
